[workspace]
members = ["crates/stormrfb", "crates/stormrfb-client", "crates/stormrfb-server", "crates/stormrfb-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
stormrfb = { path = "crates/stormrfb" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
